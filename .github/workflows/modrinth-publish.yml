name: Modrinth Publish

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: Release notes for this version
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: modrinth-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify publishing configuration
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
        run: |
          test -n "$MODRINTH_TOKEN" || { echo 'Set the MODRINTH_TOKEN repository secret.'; exit 1; }
          test -n "$MODRINTH_ID" || { echo 'Set the MODRINTH_ID repository variable.'; exit 1; }

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Read build metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          minecraft=$(sed -n 's/^minecraft_version=//p' gradle.properties | tr -d '\r')
          archive=$(sed -n 's/^archives_base_name=//p' gradle.properties | tr -d '\r')
          test -n "$version" && test -n "$minecraft" && test -n "$archive"
          if [[ -n "$RELEASE_TAG" && "${RELEASE_TAG#v}" != "$version" ]]; then
            echo 'Release tag must match mod_version in gradle.properties (optional v prefix).'
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minecraft=$minecraft" >> "$GITHUB_OUTPUT"
          echo "jar=build/libs/$archive-$version.jar" >> "$GITHUB_OUTPUT"

      - name: Build and run reward checks
        # Override the local Windows Java path for the Linux runner.
        run: bash ./gradlew "-Dorg.gradle.java.home=$JAVA_HOME" --no-daemon clean build

      - name: Upload to Modrinth
        uses: cloudnode-pro/modrinth-publish@3870f66007063f03fb70118ca9eddbc09a4ba666 # v2.5.2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: ${{ vars.MODRINTH_ID }}
          name: Dragon Rewards ${{ steps.metadata.outputs.version }}
          version: ${{ steps.metadata.outputs.version }}
          channel: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          changelog: ${{ github.event.release.body || inputs.changelog }}
          loaders: fabric
          game-versions: ${{ steps.metadata.outputs.minecraft }}
          files: ${{ steps.metadata.outputs.jar }}
          dependencies: '[{"project_id":"P7dR8mSH","dependency_type":"required"}]'
